# One command: docker compose up --build
# Copy .env.example to .env first and set JWT_SECRET and SETUP_TOKEN.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  face-service:
    build: ./face-service
    restart: unless-stopped
    # Not published: only the backend talks to it.
    expose: ["8000"]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      face-service: { condition: service_started }
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/attendance_system
      FACE_SERVICE_URL: http://face-service:8000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      ALLOWED_ORIGINS: ${DASHBOARD_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports: ["5000:5000"]

  admin-dashboard:
    build:
      context: ./admin-dashboard
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:5000/api}
    restart: unless-stopped
    depends_on: [backend]
    ports: ["8080:80"]

volumes:
  mongo-data:
